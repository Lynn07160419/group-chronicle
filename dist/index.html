<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <script>if (location.protocol === 'file:') location.replace('http://127.0.0.1:8765/');</script>
  <title>小团编年史 · 手语分社</title>
  <meta name="description" content="手语分社小团历史查询与新团名录入。按学期、星期或团名查找，自动查重。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Ctext x='5' y='24' font-size='24' fill='white'%3E团%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
  <header><div class="brand"><span class="mark" aria-hidden="true">团</span><span>手语分社</span></div></header>
  <main>
    <section class="intro"><h1>小团编年史</h1><div class="stats"><div><strong id="nameCount">—</strong><span>历史团名</span></div><div><strong id="recordCount">—</strong><span>活动记录</span></div></div></section>
    <div id="connection" class="connection" role="alert" hidden></div>
    <div class="workspace">
      <section class="archive" aria-labelledby="queryTitle">
        <div class="sectionhead"><h2 id="queryTitle">查找小团</h2><div class="archiveActions"><span id="range" class="muted">正在读取档案</span><button id="exportExcel" class="quiet" type="button">导出全部 Excel</button></div></div>
        <p id="exportStatus" role="status" aria-live="polite" hidden></p>
        <div class="filters"><label class="searchlabel">团名关键词<input id="search" type="search" placeholder="输入团名，例如：彩虹团" autocomplete="off"></label><div class="filterrow"><label>学期<select id="semesterFilter"><option value="">全部学期</option></select></label><label>活动时间<select id="dayFilter"><option value="">全部星期</option></select></label><button id="reset" class="quiet" type="button">重置筛选</button></div></div>
        <div class="resulthead"><p id="resultCount" role="status">正在加载…</p><span class="muted">按学期从新到旧</span></div>
        <div class="tablewrap"><table><thead><tr><th scope="col">小团名称</th><th scope="col">学期</th><th scope="col">活动时间</th></tr></thead><tbody id="results"></tbody></table></div>
        <div id="empty" class="empty" hidden><strong>没有找到对应的小团</strong><p>试试更短的团名，或调整学期和星期。</p></div>
        <div class="pagination"><button id="prev" class="quiet" type="button">上一页</button><span id="pageInfo"></span><button id="next" class="quiet" type="button">下一页</button></div>
      </section>
      <aside class="entry" aria-labelledby="entryTitle"><div class="entrytop"><span class="eyebrow">续写编年史</span><h2 id="entryTitle">录入新小团</h2><p>先查重，再把新名字记下来。</p></div>
        <form id="entryForm"><label for="newName">小团名称 <span class="required">*</span></label><input id="newName" name="name" placeholder="给小团取个新名字" required maxlength="100" autocomplete="off"><p class="hint">多个别名可用 / 分隔，每个别名都会查重。</p><div id="nameStatus" class="nameStatus" role="status" aria-live="polite">输入团名后自动查重</div>
          <label for="year">学年 <span class="required">*</span></label><select id="year" required></select>
          <div class="formrow"><label>学期 <span class="required">*</span><select id="term"><option value="上">上学期</option><option value="下">下学期</option></select></label><label>活动时间 <span class="required">*</span><select id="newDay" required><option value="">选择星期</option></select></label></div>
          <button id="save" class="primary" type="submit" disabled>查重并录入 <span aria-hidden="true">＋</span></button><div id="saveStatus" role="status" aria-live="polite"></div>
        </form><div class="entrynote">历史上使用过的团名不能再次录入。查重忽略空格、英文字母大小写及全角／半角差异。</div>
      </aside>
    </div>
    <footer><span>数据来源：团名查重库（小团编年史）</span></footer>
  </main>
</body>
</html>
